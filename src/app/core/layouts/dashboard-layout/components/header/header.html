<header class="main-header">
    <!-- Sol Bölüm: Arama -->
    <div class="header-left">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Search streams, push history or device tokens..." />
        </div>
    </div>

    <!-- Sağ Bölüm: Sistem Durumu ve Profil -->
    <div class="header-right">
        <!-- SignalR / Canlı Durum Göstergesi -->
        <div class="status-indicator" [class.connected]="isConnected" (click)="toggleConnection()">
            <span class="status-dot"></span>
            <span class="status-text">{{ isConnected ? 'Flux Connected' : 'Flux Disconnected' }}</span>
        </div>

        <!-- Bildirim Çanı -->
        <button class="icon-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="badge-count">3</span>
        </button>

        <div class="divider"></div>

        <!-- Kullanıcı Profil Alanı -->
        <div class="user-profile">
            <div class="avatar">FL</div>
            <div class="profile-info">
                <span class="username">Fluxify Root</span>
                <span class="role">System Developer</span>
            </div>
        </div>
    </div>
</header>

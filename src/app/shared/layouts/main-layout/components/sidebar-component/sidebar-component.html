<aside class="sidebar">
    <!-- Logo Bölümü -->
    <div class="logo-area">
        <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
        </div>
        <div class="logo-text">
            <h2>Fluxify</h2>
            <span>Console v1.0</span>
        </div>
    </div>

    <nav class="nav-menu">
        @for (menuItem of menuItems; track $index) {
        @if(!menuItem.children){
        <a routerLink="{{menuItem.route}}" routerLinkActive="active" class="nav-item">
            <i class="nav-icon" [class]="menuItem.icon"></i>
            <span>{{menuItem.title}}</span>
        </a>
        }
        @else {
        <div class="nav-group">
            <button type="button" class="nav-item nav-dropdown-toggle">
                <i class="nav-icon" [class]="menuItem.icon"></i>
                <span class="nav-title">{{menuItem.title}}</span>
                <i class="fa-solid fa-chevron-down nav-arrow"></i>
            </button>

            <div class="nav-submenu">
                @for (subMenuItem of menuItem.children; track $index) {
                <a routerLink="{{subMenuItem.route}}" routerLinkActive="active" class="nav-sub-item">
                    <span>{{subMenuItem.title}}</span>
                </a>
                }
            </div>
        </div>
        }
        }
    </nav>

    <!-- Alt Bilgi / Çevre Belirteci -->
    <div class="sidebar-footer">

    </div>
</aside>

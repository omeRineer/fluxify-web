<div class="rooms__toolbar">
    <div class="search">
        <svg viewBox="0 0 24 24" fill="none" class="search__icon">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" />
            <path d="m20 20-3.6-3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input type="text" placeholder="Kullanıcı veya kanal ara..." /> 
    </div>

    <button (click)="createChat()" type="button" class="rooms__new" title="Yeni sohbet">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
    </button>
</div>

<div class="rooms__list">

    @if(isLoading()){
    <app-spinner></app-spinner>
    }
    @else {
    @for (room of this.chatStore.entities(); track room.id) {
    <button type="button" class="room" [class.room--active]="room.id === selectedRoom()?.id" (click)="selectRoom(room)">
        <span class="room__marker"></span>

        <span class="room__avatar" [style.background]="avatarColor(room.id)">
            {{ room.title[0].toUpperCase() }}{{ room.title[1].toUpperCase() }}
        </span>

        <span class="room__body">
            <span class="room__top">
                <span class="room__name">{{ room.title }}</span>
                <span class="room__time">{{ room.createDate | timeAgo }}</span>
            </span>

            <span class="room__bottom">
                @if (room.isTyping()) {
                <span class="room__typing">
                    yazıyor
                    <span class="dots">
                        <span></span><span></span><span></span>
                    </span>
                </span>
                } @else {
                <span class="room__preview">{{ room.lastMessage }}</span>
                }
            </span>
        </span>
    </button>
    } @empty {
    <div class="rooms__empty">Sonuç bulunamadı</div>
    }
    }
</div>

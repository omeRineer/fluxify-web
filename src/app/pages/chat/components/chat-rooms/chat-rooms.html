<aside class="chat-sidebar">
    <div class="sidebar-search">
        <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Search users or channels..." />
        </div>

        <button type="button" class="new-chat-btn" (click)="createChat()" title="Yeni Sohbet / Grup">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>


    <div class="user-list">

        @if(isLoading()){
        <app-spinner></app-spinner>
        }
        @else {
            @for (room of allRooms(); track room.id) {
                <a (click)="selectRoom(room)" [routerLink]="['/chat', room.id]" routerLinkActive="active" class="user-card">
                    <div class="avatar-wrapper">
                        <div class="user-avatar">{{ room.title[0].toUpperCase() }}{{ room.title[1].toUpperCase() }}</div>
                    </div>
                    <div class="user-details">
                        <div class="user-meta">
                            <span class="user-name">{{ room.title }}</span>
                            <span class="chat-time">{{ room.createDate | smartDate }}</span>
                        </div>
                        <p class="last-message">...</p>
                    </div>
                </a>
            }
        }

    </div>
</aside>

<section class="chat-main">
  <!-- Header -->
  <header class="chat-header">
    <div class="active-user-info">
      <div class="avatar-wrapper">
        <div class="user-avatar">AD</div>
        <span class="status-badge online"></span>
      </div>
      <div class="active-details">
        <h3>{{ selectedRoom()?.title }}</h3>
        <p>Software Developer - Client Stream</p>
      </div>
    </div>
    <div class="chat-actions">
      <button class="action-btn" title="Call Info"><i class="fa-solid fa-circle-info"></i></button>
      <button class="action-btn" title="More Options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </div>
  </header>

  <!-- Message History & Loading -->
  <div class="message-history">
    @if(isLoading()){
      <app-spinner></app-spinner>
    }
    @else {
      @for (msg of chatMessages(); track $index) {
        <div class="message-row" [class.incoming]="msg.userId !== usercontext.state$().NameIdentifier"
          [class.outgoing]="msg.userId === usercontext.state$().NameIdentifier">

          <div class="message-box">
            <p class="message-text">{{ msg.text }}</p>
            <span class="message-time">{{ msg.date | date:'shortTime' }}</span>
          </div>
        </div>
      }
    }
  </div>

  <!-- Footer -->
  <footer class="chat-footer">
    <div class="input-container">
      <button class="attach-btn" type="button"><i class="fa-solid fa-paperclip"></i></button>
      <input
        #messageBox
          [ngModel]="messageText()"
          (ngModelChange)="messageText.set($event)"
          (keydown)="onKeyDown($event)"
       type="text" placeholder="Type a message..." />
      <button
        (click)="sendMessage()"
        [disabled]="!messageText().trim()"
       class="send-btn" type="button"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </footer>
</section>

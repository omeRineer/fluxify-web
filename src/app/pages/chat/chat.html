<div class="chat-shell">
    @if(chatHubService.connectionStatus$() === 'Connecting'){
    <app-spinner></app-spinner>
    }
    @else {
    <div class="chat-shell__rooms">
        <app-chat-rooms></app-chat-rooms>
    </div>
    <div class="chat-shell__history">
        <router-outlet></router-outlet>
    </div>
    }
</div>

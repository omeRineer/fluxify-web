<div class="login-card">
  <!-- Logo & Başlık -->
  <div class="brand-header">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <h1 class="brand-title">Fluxify</h1>
    <p class="brand-subtitle">Anlık Mesajlaşma ve Varlık Platformu</p>
  </div>

  <!-- Form -->
  <form (ngSubmit)="onLogin()" class="login-form">
    <div class="form-group">
      <label for="apiKey">API Key ile Giriş Yap</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
        <input 
          id="apiKey"
          type="password" 
          placeholder="bVNONIPtXjY9U2S..." 
          [ngModel]="apiKey()"
          (ngModelChange)="apiKey.set($event)"
          name="apiKey"
          autocomplete="off"
          [disabled]="isLoading()"
        />
      </div>
    </div>

    @if (errorMessage()) {
      <div class="error-alert">
        {{ errorMessage() }}
      </div>
    }

    <button type="submit" class="submit-btn" [disabled]="isLoading() || !apiKey().trim()">
      @if (isLoading()) {
        <span class="btn-spinner"></span>
        <span>Doğrulanıyor...</span>
      } @else {
        <span>Giriş Yap</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      }
    </button>
  </form>

  <div class="login-footer">
    <span class="text-muted">API Key'iniz yok mu? Sistem yöneticinizle iletişime geçin.</span>
  </div>
</div>

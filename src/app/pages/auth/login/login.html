<div class="login-card">
  <!-- Logo & Başlık -->
  <div class="brand-header">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
      </svg>
    </div>
    <h1 class="brand-title">Fluxify Panel</h1>
  </div>

  <!-- Form -->
  <form (ngSubmit)="onLogin()" class="login-form">

    <!-- Kullanıcı Adı -->
    <div class="form-group">
      <label for="username">Kullanıcı Adı</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input id="username" type="text" placeholder="kullanici_adi" [ngModel]="username()"
          (ngModelChange)="username.set($event)" name="username" autocomplete="username" [disabled]="isLoading()" />
      </div>
    </div>

    <!-- Şifre -->
    <div class="form-group">
      <label for="password">Şifre</label>
      <div class="input-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input id="password" [type]="showPassword() ? 'text' : 'password'" placeholder="••••••••" [ngModel]="password()"
          (ngModelChange)="password.set($event)" name="password" autocomplete="current-password"
          [disabled]="isLoading()" />

        <!-- Şifre Göster / Gizle Butonu -->
        <button type="button" class="password-toggle-btn" (click)="showPassword.set(!showPassword())" tabindex="-1">
          @if (showPassword()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
            </path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          }
        </button>
      </div>
    </div>

    @if (errorMessage()) {
    <div class="error-alert">
      {{ errorMessage() }}
    </div>
    }

    <button type="submit" class="submit-btn" [disabled]="isLoading() || !username().trim() || !password().trim()">
      @if (isLoading()) {
      <span class="btn-spinner"></span>
      <span>Doğrulanıyor...</span>
      } @else {
      <span>Giriş Yap</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
      }
    </button>
  </form>

  <div class="login-footer">
    <span class="text-muted">Hesabınız yok mu? Sistem yöneticinizle iletişime geçin.</span>
  </div>
</div>
